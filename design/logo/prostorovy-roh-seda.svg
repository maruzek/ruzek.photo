  <title id="title">Martin Růžek — Prostorový kout — stupně šedi</title>
  <desc id="desc">Tři izometrické plochy složené z drobných čtverců se setkávají v jednom rohu. Jednotlivé čtverce mají různé stupně šedi. Hustý střed přechází ordered ditheringem do rozptýlených okrajů.</desc>
