<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Okno do fotky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Notch:wght@700&family=Stack+Sans+Text:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ecebe7;
    --ink: #121212;
    --muted: #6f6e6a;
    --gutter: clamp(12px, 2.2vw, 28px);
    --nav: 60px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Stack Sans Text", system-ui, sans-serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- placeholder page ---------- */
  .nav {
    height: var(--nav); padding: 0 var(--gutter);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; letter-spacing: .02em;
  }
  .nav b { font-weight: 500; }
  .nav span { color: var(--muted); }
  .hero {
    position: relative; overflow: hidden;
    margin: 0 var(--gutter);
    height: calc(100svh - var(--nav) - var(--gutter));
    min-height: 300px;
  }
  .hero-photo {
    position: absolute; inset: 0;
    background:
      radial-gradient(110% 85% at 68% 32%, #d2d1cc 0%, #9a9994 30%, #5b5a56 62%, #2b2b29 100%);
    transform-origin: 50% 45%;
  }
  .hero-tag { position: absolute; right: 14px; top: 12px; font-size: 11px; letter-spacing: .06em; color: rgba(255,255,255,.7); }
  .hl {
    position: absolute; left: clamp(14px, 2.4vw, 32px); bottom: clamp(10px, 2vw, 24px);
    font-family: "Stack Sans Notch", "Stack Sans Text", system-ui, sans-serif;
    font-weight: 700; color: #f4f3ef;
    font-size: max(64px, min(13vw, 21vh));
    line-height: .92; letter-spacing: -.035em;
  }
  .hl .ln { display: block; overflow: hidden; padding-bottom: .05em; }
  .hl .ln > span { display: inline-block; }
  .shots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 10px var(--gutter) var(--gutter); }
  .shot { aspect-ratio: 4 / 5; background: linear-gradient(160deg, #b5b4b0, #6d6c68); }
  .shot:nth-child(2) { background: linear-gradient(200deg, #8f8e8a, #4f4e4b); }
  .shot:nth-child(3) { background: linear-gradient(140deg, #c8c7c3, #858480); }
  @media (max-width: 640px) { .shots { grid-template-columns: repeat(2, minmax(0, 1fr)); } .shot:nth-child(3) { display: none; } }

  /* loading state (JS only) */
  .js .loading .hero { z-index: 30; clip-path: url(#win); }
  .js .loading .hl .ln > span { transform: translateY(135%); }
  .js .loading .nav > * , .js .loading .hero-tag { opacity: 0; }

  /* ---------- loader ---------- */
  #lbg { position: fixed; inset: 0; z-index: 20; background: var(--paper); }
  #stage { position: fixed; inset: 0; z-index: 40; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  #count {
    position: fixed; z-index: 41; left: 0; right: 0; text-align: center;
    font: 400 11px/1 "Stack Sans Text", system-ui, sans-serif; letter-spacing: .08em;
    color: var(--muted); font-variant-numeric: tabular-nums; pointer-events: none;
  }
  .gone { display: none !important; }

  /* ---------- demo controls (not part of the design) ---------- */
  .ctl {
    position: fixed; z-index: 100; right: 10px; bottom: 10px;
    display: flex; flex-wrap: wrap; gap: 4px; align-items: center; justify-content: flex-end;
    font: 500 11px/1 "Stack Sans Text", system-ui, sans-serif; max-width: calc(100vw - 20px);
  }
  .ctl button {
    font: inherit; cursor: pointer; border: 0; border-radius: 999px; padding: 7px 10px;
    background: rgba(128,128,128,.28); color: #fff; mix-blend-mode: difference;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .ctl button:hover { background: rgba(128,128,128,.5); }
  .ctl button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .ctl-s { color: #fff; mix-blend-mode: difference; opacity: .7; padding: 0 6px; white-space: nowrap; }
</style>
</head>
<body>
<script>document.documentElement.classList.add('js');</script>

<div class="page loading" id="page">
  <header class="nav"><b>ruzek.jpg</b><span>Menu</span></header>
  <section class="hero" id="hero" aria-label="Úvodní fotka">
    <div class="hero-photo" id="photo"></div>
    <span class="hero-tag">foto</span>
    <h1 class="hl"><span class="ln"><span>Martin</span></span><span class="ln"><span>Růžek</span></span></h1>
  </section>
  <section class="shots" aria-label="Ukázky fotek">
    <div class="shot"></div><div class="shot"></div><div class="shot"></div>
  </section>
</div>

<div id="lbg" aria-hidden="true"></div>
<svg id="stage" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <defs><clipPath id="win" clipPathUnits="userSpaceOnUse"></clipPath></defs>
  <g id="logoG"></g>
</svg>
<div id="count" aria-hidden="true">ruzek_0001.jpg</div>

<div class="ctl" role="group" aria-label="Ovládání ukázky">
  <button type="button" data-ms="replay">Znovu</button>
  <button type="button" data-ms="300">Rychlé načtení</button>
  <button type="button" data-ms="5000">Pomalé načtení</button>
  <span class="ctl-s" id="status" aria-live="polite"></span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
/*
  Concept c-2 "Okno do fotky"
  The logo's 74 tiles are also a clipPath on the real hero section. While loading, a burst rhythm
  (three focal-plane "clicks" sweeping top to bottom) briefly dips the tiles, so the photo flashes through
  them; a file counter ruzek_0001.jpg ticks with each frame. On load the tiles turn transparent (darkest
  first) and become windows; the camera dives into the corner tile until it covers the hero frame exactly,
  then the clip is dropped and the page continues (headline slides up, nav fades in).

  Real page hook (Astro): #lbg/#stage are in the initial HTML with inline CSS; the hero <img> sits in .hero.
  "loaded" = Promise.race([Promise.all([document.fonts.ready, heroImg.decode()]), timeout(4000)]).
  The idle glimpses can show the LQIP placeholder; the dive only starts once the real hero image decoded.
  First visit per session only; Astro view transitions skip it.
*/
(() => {
  const RAW = "00000102020403030405001101120313051400220123022203240423062601340334004401430244044401540556026606651000110013031504101211101212131114131614112112221321103111321233133214341143134315431053125314521656200021022201230324052606211222112313202221232222232424232131233425352044224424432644235320642466";
  const GREYS = ["#181818", "#383838", "#585858", "#787878", "#989898", "#b8b8b8", "#d0d0d0"];
  const M = [[13.8564, -8, -13.8564, -8], [-13.8564, -8, 0, 16], [0, 16, 13.8564, -8]];
  const OX = 160, OY = 146, A = 0.105, Z = 0.895;
  const NS = "http://www.w3.org/2000/svg";
  const logoG = document.getElementById("logoG"), clipG = document.getElementById("win"); // clipPath may only hold shapes, so the transform sits on <clipPath> itself
  const page = document.getElementById("page"), hero = document.getElementById("hero"), photo = document.getElementById("photo");
  const lbg = document.getElementById("lbg"), stage = document.getElementById("stage"), count = document.getElementById("count");
  const statusEl = document.getElementById("status");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");

  // build tiles (viewBox-320 coordinates, identical geometry to prostorovy-roh-seda.svg)
  const tiles = [];
  for (let n = 0; n < RAW.length; n += 4) {
    const f = +RAW[n], i = +RAW[n + 1], j = +RAW[n + 2], g = +RAW[n + 3];
    const [a, b, c, d] = M[f];
    const P = (u, v) => [OX + a * u + c * v, OY + b * u + d * v];
    const pts = [P(i + A, j + A), P(i + Z, j + A), P(i + Z, j + Z), P(i + A, j + Z)];
    const dstr = "M" + pts.map((p) => p[0].toFixed(3) + " " + p[1].toFixed(3)).join("L") + "Z";
    const fill = document.createElementNS(NS, "path");
    fill.setAttribute("d", dstr); fill.setAttribute("fill", GREYS[g]);
    const clip = document.createElementNS(NS, "path");
    clip.setAttribute("d", dstr);
    logoG.appendChild(fill); clipG.appendChild(clip);
    const cy = pts.reduce((s, p) => s + p[1], 0) / 4;
    tiles.push({ f, i, j, g, fill, clip, cy, m: Math.max(i, j) });
  }
  const fills = tiles.map((t) => t.fill), clips = tiles.map((t) => t.clip);
  const byCorner = [...tiles].sort((p, q) => p.m - q.m || p.g - q.g);
  const byY = [...tiles].sort((p, q) => p.cy - q.cy);
  const byGrey = [...tiles].sort((p, q) => p.g - q.g || p.m - q.m);
  const TC = [160, 138]; // centre of the top-face corner tile: the window we dive into

  // ---- layout ----
  let K = 1, LX = 0, LY = 0, HR = null; // logo scale, logo box top-left, hero rect
  function layout() {
    const W = innerWidth, H = innerHeight;
    K = Math.min(1, Math.min(W * 0.58, H * 0.42) / 320);
    LX = W / 2 - 160 * K; LY = H / 2 - 168 * K;
    HR = hero.getBoundingClientRect();
    count.style.top = (LY + 268 * K) + "px";
    stage.setAttribute("viewBox", `0 0 ${W} ${H}`);
    setView(K, LX + TC[0] * K, LY + TC[1] * K);
  }
  // place the logo so that the corner tile centre TC sits at screen point (px,py) with scale s
  function setView(s, px, py) {
    const tx = px - s * TC[0], ty = py - s * TC[1];
    logoG.setAttribute("transform", `matrix(${s} 0 0 ${s} ${tx} ${ty})`);
    clipG.setAttribute("transform", `matrix(${s} 0 0 ${s} ${tx - HR.left} ${ty - HR.top})`);
  }

  // ---- controller ----
  let gen = 0, lastMs = 900, timers = [], idle = null, tl = null, frame = 1;
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  const fmt = (ms) => (ms / 1000).toLocaleString("cs-CZ", { maximumFractionDigits: 1 }) + " s";
  const status = (s) => (statusEl.textContent = s);
  const setCount = () => (count.textContent = "ruzek_" + String(frame).padStart(4, "0") + ".jpg");

  function reset() {
    gen++;
    timers.forEach(clearTimeout); timers = [];
    gsap.globalTimeline.getChildren().forEach((c) => c.kill());
    gsap.set([...fills, ...clips], { clearProps: "transform,opacity" });
    gsap.set([lbg, stage, count, photo, ".hl .ln > span", ".nav > *", ".hero-tag"], { clearProps: "all" });
    [lbg, stage, count].forEach((el) => el.classList.remove("gone"));
    page.classList.add("loading");
    scrollTo(0, 0);
    frame = 1; setCount();
  }

  function start(ms) {
    lastMs = ms;
    reset();
    const my = gen;
    layout();
    status("načítání " + fmt(ms) + "…");
    const loaded = new Promise((r) => later(r, ms)); // simulated page load
    if (reduce.matches) return startReduced(ms, my, loaded);

    // intro: tiles pop in from the corner outward, fill and window together
    gsap.set(count, { opacity: 0 });
    const intro = gsap.timeline();
    byCorner.forEach((t, n) => {
      intro.fromTo([t.fill, t.clip], { scale: 0, transformOrigin: "50% 50%" },
        { scale: 1, duration: .32, ease: "back.out(2)" }, n * (.34 / tiles.length));
    });
    intro.to(count, { opacity: 1, duration: .3 }, .25);
    intro.add(() => { if (my === gen) runIdle(); });

    const minShown = new Promise((r) => later(r, 620)); // never cut the intro
    Promise.all([loaded, minShown]).then(() => { if (my === gen) exit(my); });
  }

  // idle: burst of three focal-plane "clicks", the photo flashes through the tiles
  function runIdle() {
    idle = gsap.timeline({ repeat: -1, repeatDelay: .62 });
    for (let c = 0; c < 3; c++) {
      const at = c * .17;
      idle.to(byY.map((t) => t.fill), {
        keyframes: [{ opacity: .12, duration: .045, ease: "none" }, { opacity: 1, duration: .09, ease: "power1.in" }],
        stagger: .075 / tiles.length,
      }, at);
      idle.add(() => { frame++; setCount(); }, at + .04);
    }
  }

  function exit(my) {
    status("načteno, odchod");
    if (idle) idle.kill();
    layout();
    const W = innerWidth, H = innerHeight;
    const hc = [HR.left + HR.width / 2, HR.top + HR.height / 2];
    // scale (px per logo unit) at which the corner rhombus (half-diagonals 10.947 x 6.32) covers the hero frame
    const S = (HR.width / 2 / 10.947 + HR.height / 2 / 6.32) * 1.04;
    const p0 = [LX + TC[0] * K, LY + TC[1] * K];
    const v = { t: 0, p: 0 };
    const apply = () => {
      const s = K * Math.pow(S / K, v.t);
      setView(s, p0[0] + (hc[0] - p0[0]) * v.p, p0[1] + (hc[1] - p0[1]) * v.p);
    };
    tl = gsap.timeline({ onComplete: () => status("hotovo · " + fmt(lastMs)) });
    tl.to(fills, { opacity: 1, duration: .1 }, 0)
      .to(count, { opacity: 0, duration: .25 }, 0)
      // tiles become windows: darkest first (the corner exposes first)
      .to(byGrey.map((t) => t.fill), { opacity: 0, duration: .22, ease: "power1.out", stagger: .3 / tiles.length }, .1)
      .fromTo(photo, { scale: 1.18 }, { scale: 1, duration: 1.5, ease: "expo.out" }, .25)
      // the dive into the corner tile
      .to(v, { t: 1, duration: .9, ease: "power3.in", onUpdate: apply }, .3)
      .to(v, { p: 1, duration: .9, ease: "power2.inOut" }, .3)
      .add(() => {
        page.classList.remove("loading");
        [lbg, stage, count].forEach((el) => el.classList.add("gone"));
      }, 1.2)
      .to(".hl .ln > span", { y: 0, duration: 1, stagger: .08, ease: "expo.out" }, 1.22)
      .to([".nav > *", ".hero-tag"], { opacity: 1, duration: .5, stagger: .05 }, 1.3);
  }

  function startReduced(ms, my, loaded) {
    gsap.set(count, { opacity: 0 });
    gsap.fromTo(logoG, { opacity: 0 }, { opacity: 1, duration: .3 });
    gsap.set(fills, { opacity: 1 });
    const minShown = new Promise((r) => later(r, 500));
    Promise.all([loaded, minShown]).then(() => {
      if (my !== gen) return;
      page.classList.remove("loading");
      gsap.set([".hl .ln > span"], { y: 0 });
      gsap.set([".nav > *", ".hero-tag"], { opacity: 1 });
      tl = gsap.timeline({ onComplete: () => { [lbg, stage, count].forEach((el) => el.classList.add("gone")); gsap.set(logoG, { clearProps: "opacity" }); status("hotovo · " + fmt(ms)); } });
      tl.to([lbg, stage], { opacity: 0, duration: .4, ease: "power1.out" });
    });
  }

  document.querySelectorAll(".ctl button").forEach((b) =>
    b.addEventListener("click", () => start(b.dataset.ms === "replay" ? lastMs : +b.dataset.ms)));
  let rz;
  addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (page.classList.contains("loading") && !(tl && tl.isActive())) layout(); }, 120); });

  start(900);
})();
</script>
</body>
</html>
