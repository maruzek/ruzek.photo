<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pole světla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Notch:wght@400..700&family=Stack+Sans+Text:wght@400..600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<style>
  :root {
    --paper: #efeee9;
    --ink: #141414;
    --mute: #74736e;
    --block: #d6d5cf;
    --block-2: #c9c8c2;
    --gutter: clamp(16px, 3.2vw, 44px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; overflow-x: hidden; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Stack Sans Text", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- placeholder page ---------- */
  .nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px var(--gutter);
  }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 14px; letter-spacing: .01em; }
  #navMark { width: 34px; height: auto; display: block; visibility: hidden; }
  .nav nav { display: flex; gap: 22px; font-size: 14px; color: var(--mute); }
  .hero { padding: clamp(8px, 4vh, 48px) var(--gutter) 64px; }
  h1 {
    font-family: "Stack Sans Notch", ui-sans-serif, system-ui, sans-serif;
    font-weight: 600;
    font-size: clamp(64px, 14.5vw, 232px);
    line-height: .86;
    letter-spacing: -.035em;
  }
  .line { display: block; overflow: hidden; padding-bottom: .04em; }
  .line > span { display: inline-block; }
  .sub { margin-top: 18px; display: flex; justify-content: space-between; font-size: 14px; color: var(--mute); }
  .grid {
    margin-top: clamp(24px, 5vh, 56px);
    display: grid; gap: clamp(8px, 1.2vw, 16px);
    grid-template-columns: repeat(4, 1fr);
  }
  .ph {
    aspect-ratio: 4 / 5; background: var(--block); position: relative;
  }
  .ph:nth-child(even) { background: var(--block-2); aspect-ratio: 4 / 6; }
  .ph span { position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: var(--mute); }
  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .nav nav { gap: 14px; }
  }

  /* initial hidden state (the loader covers it anyway) */
  .js .line > span { transform: translateY(110%); }
  .js .ph { clip-path: inset(100% 0 0 0); }
  .js .fade { opacity: 0; }

  /* ---------- loader ---------- */
  #loader {
    position: fixed; inset: 0; z-index: 50;
    background: var(--paper);
  }
  #loader canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #mark { position: absolute; display: block; visibility: hidden; transform-origin: 0 0; will-change: transform; }
  .meta {
    position: absolute; top: 14px; left: var(--gutter); right: var(--gutter);
    display: flex; justify-content: space-between; pointer-events: none;
    font-size: 12px; letter-spacing: .04em; color: var(--ink);
  }
  .meta span { background: var(--paper); padding: 4px 8px; font-variant-numeric: tabular-nums; }

  /* ---------- demo controls (not part of the design) ---------- */
  .controls {
    position: fixed; z-index: 100; left: 50%; bottom: 12px; transform: translateX(-50%);
    display: flex; gap: 4px; align-items: center; padding: 4px;
    background: rgba(20,20,20,.86); border-radius: 999px;
    font: 500 12px/1 "Stack Sans Text", system-ui, sans-serif; color: #eee;
    max-width: calc(100vw - 24px); white-space: nowrap;
  }
  .controls button, .controls label {
    font: inherit; color: inherit; background: transparent; border: 0; cursor: pointer;
    padding: 7px 10px; border-radius: 999px; display: flex; align-items: center; gap: 6px;
  }
  .controls button:hover, .controls label:hover { background: rgba(255,255,255,.12); }
  .controls button[aria-pressed="true"] { background: #efeee9; color: #141414; }
  .controls input { accent-color: #efeee9; margin: 0; }
  .controls .status { padding: 0 10px 0 6px; color: #9a9a96; min-width: 7.5em; }
  @media (max-width: 480px) { .controls .status { display: none; } }
</style>
</head>
<body>
<script>document.documentElement.classList.add('js');</script>

<div class="page" id="page">
  <header class="nav">
    <div class="brand"><svg id="navMark" viewBox="63 34 194 224" aria-hidden="true"></svg><span class="fade">ruzek.jpg</span></div>
    <nav class="fade"><span>Portfolio</span><span>Kontakt</span></nav>
  </header>
  <main class="hero">
    <h1 aria-label="Martin Růžek"><span class="line"><span>Martin</span></span><span class="line"><span>Růžek</span></span></h1>
    <div class="sub fade"><span>ruzek.jpg</span><span>Praha</span></div>
    <div class="grid">
      <figure class="ph"><span>Foto 01</span></figure>
      <figure class="ph"><span>Foto 02</span></figure>
      <figure class="ph"><span>Foto 03</span></figure>
      <figure class="ph"><span>Foto 04</span></figure>
    </div>
  </main>
</div>

<div id="loader" aria-hidden="true">
  <canvas id="cv"></canvas>
  <svg id="mark" viewBox="63 34 194 224"></svg>
  <div class="meta"><span>ruzek.jpg</span><span id="pct">000</span></div>
</div>

<div class="controls" role="group" aria-label="Ukázka načítání">
  <button id="bReplay" type="button">Znovu</button>
  <button id="bFast" type="button" aria-pressed="false">Rychle 0,2 s</button>
  <button id="bSlow" type="button" aria-pressed="false">Pomalu 5 s</button>
  <label><input id="bReduce" type="checkbox"> Bez pohybu</label>
  <span class="status" id="status"></span>
</div>

<script>
(() => {
  /* ---------- logo data: face + i + j + grey index (exactly the logo) ---------- */
  const RAW = 't000 t102 t204 t303 t405 t011 t112 t313 t514 t022 t123 t222 t324 t423 t626 t134 t334 t044 t143 t244 t444 t154 t556 t266 t665 l000 l100 l303 l504 l012 l110 l212 l311 l413 l614 l121 l222 l321 l031 l132 l233 l332 l434 l143 l343 l543 l053 l253 l452 l656 r000 r102 r201 r303 r405 r606 r112 r211 r313 r022 r123 r222 r324 r423 r131 r334 r535 r044 r244 r443 r644 r353 r064 r466';
  const GREYS = ['#181818', '#383838', '#585858', '#787878', '#989898', '#b8b8b8', '#d0d0d0'];
  const FACES = ['t', 'l', 'r'];
  const MAT = { t: [13.8564, -8, -13.8564, -8], l: [-13.8564, -8, 0, 16], r: [0, 16, 13.8564, -8] };
  const FDIR = { t: [0, -1], l: [-0.866, 0.5], r: [0.866, 0.5] };       // direction each face points to
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const LOGO = RAW.split(' ').map(s => ({ f: s[0], i: +s[1], j: +s[2], g: +s[3] }));
  const LOGO_MAP = new Map(LOGO.map(t => [t.f + t.i + ',' + t.j, t.g]));

  /* identical markup to prostorovy-roh-seda.svg */
  const markMarkup = FACES.map(f => {
    const m = MAT[f];
    return `<g transform="matrix(${m.join(' ')} 160 146)">` + LOGO.filter(t => t.f === f)
      .map(t => `<path fill="${GREYS[t.g]}" d="M${t.i}.105 ${t.j}.105h.79v.79h-.79z"/>`).join('') + '</g>';
  }).join('');
  const $ = id => document.getElementById(id);
  $('mark').innerHTML = markMarkup;
  $('navMark').innerHTML = markMarkup;

  const loader = $('loader'), cv = $('cv'), ctx = cv.getContext('2d'), mark = $('mark'), pctEl = $('pct');
  const mq = matchMedia('(prefers-reduced-motion: reduce)');
  $('bReduce').checked = mq.matches;

  /* ---------- timing (seconds) ---------- */
  const MIN_SHOW = 0.65;    // field is always seen at least this long
  const EXIT = 0.8;         // dither recedes into the logo
  const LOAD_MS = { normal: 900, fast: 200, slow: 5000 };

  /* ---------- layout + field ---------- */
  let W, H, dpr, k, ox, oy, tiles = [], maxRing = 1;
  function layout() {
    W = innerWidth; H = innerHeight; dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    k = Math.min(W * 0.5 / 194, H * 0.4 / 224);
    ox = W / 2; oy = H * 0.49;
    Object.assign(mark.style, {
      width: 194 * k + 'px', height: 224 * k + 'px',
      left: ox - 97 * k + 'px', top: oy - 112 * k + 'px'
    });
    // the whole screen = the three faces of the logo, extended to infinity
    tiles = []; maxRing = 1;
    const N = Math.ceil(Math.hypot(W, H) / (16 * k * 0.8)) + 2, pad = 20 * k;
    for (const f of FACES) {
      const [a, b, c, d] = MAT[f];
      for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
        const u = i + .5, v = j + .5;
        const x = ox + k * (a * u + c * v), y = oy + k * (b * u + d * v);
        if (x < -pad || x > W + pad || y < -pad || y > H + pad) continue;
        const key = f + i + ',' + j, ring = Math.max(i, j);
        const logo = LOGO_MAP.has(key);
        tiles.push({ f, i, j, x, y, ring, logo, g: logo ? LOGO_MAP.get(key) : -1,
          b: (BAYER[(i & 3) * 4 + (j & 3)] + .5) / 16, lvl: 0, s: 0, lc: 0 });
        if (ring > maxRing) maxRing = ring;
      }
    }
  }

  const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const smooth = v => { v = clamp01(v); return v * v * (3 - 2 * v); };
  const easeOut = v => 1 - Math.pow(1 - clamp01(v), 3);

  /* light circling the corner + a soft spot wandering over the field */
  function shade(t, E) {
    const ang = t * Math.PI * 2 / 7 + 1.1;
    const L0 = Math.cos(ang), L1 = Math.sin(ang);
    const sx = ox + W * 0.33 * Math.cos(t * 0.5 + 0.8), sy = oy + H * 0.3 * Math.sin(t * 0.67);
    const R2 = Math.pow(Math.max(W, H) * 0.27, 2);
    const spotAmp = E < 0 ? 1 : 1 - smooth(E / 0.6);
    for (const p of tiles) {
      const fd = FDIR[p.f], sh = fd[0] * L0 + fd[1] * L1;
      const dx = p.x - sx, dy = p.y - sy;
      const spot = Math.exp(-(dx * dx + dy * dy) / R2) * spotAmp;
      const vField = 0.63 + 0.17 * sh + 0.24 * spot;
      const vCore = p.ring / 6.4 + 0.07 * sh;          // darker toward the corner, like the logo
      const w = smooth((p.ring - 5) / 8);
      const v = vCore + (vField - vCore) * w;
      let lvl = Math.floor(v * 7 + (p.b - .5) * 1.15);  // ordered dither between the 7 greys
      p.lvl = lvl < 0 ? 0 : lvl > 6 ? 6 : lvl;
    }
  }

  const buckets = FACES.map(() => GREYS.map(() => []));
  function draw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const fb of buckets) for (const b of fb) b.length = 0;
    for (const p of tiles) if (p.s > 0.001) buckets[FACES.indexOf(p.f)][p.lvl].push(p);
    FACES.forEach((f, fi) => {
      const [a, b, c, d] = MAT[f], s = dpr * k;
      ctx.setTransform(s * a, s * b, s * c, s * d, dpr * ox, dpr * oy);   // same affine map as the SVG
      buckets[fi].forEach((list, lvl) => {
        if (!list.length) return;
        ctx.beginPath();
        for (const p of list) {
          if (p.s >= 0.999) ctx.rect(p.i + .105, p.j + .105, .79, .79);
          else { const h = .395 * p.s; ctx.rect(p.i + .5 - h, p.j + .5 - h, 2 * h, 2 * h); }
        }
        ctx.fillStyle = GREYS[lvl];
        ctx.fill();
      });
    });
  }

  /* ---------- page hand-off ---------- */
  const pageEls = () => ({
    lines: document.querySelectorAll('.line > span'),
    phs: document.querySelectorAll('.ph'),
    fades: document.querySelectorAll('.fade'),
    navMark: $('navMark')
  });
  function resetPage() {
    const e = pageEls();
    gsap.killTweensOf([mark, loader, ...e.lines, ...e.phs, ...e.fades]);
    gsap.set(e.lines, { y: 0, yPercent: 110, opacity: 1 });
    gsap.set(e.phs, { clipPath: 'inset(100% 0% 0% 0%)', opacity: 1 });
    gsap.set(e.fades, { opacity: 0 });
    e.navMark.style.visibility = 'hidden';
    gsap.set(mark, { x: 0, y: 0, scale: 1, opacity: 1, visibility: 'hidden' });
    gsap.set(loader, { display: 'block', opacity: 1, backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--paper') });
    loader.style.pointerEvents = 'auto';
    cv.style.display = 'block';
    $('loader').querySelector('.meta').style.opacity = 1;
  }

  function handoff(s) {
    const e = pageEls();
    loader.style.pointerEvents = 'none';             // the site is usable from this moment
    const r1 = mark.getBoundingClientRect(), r2 = e.navMark.getBoundingClientRect();
    const tl = gsap.timeline({ onComplete: () => {
      e.navMark.style.visibility = 'visible';
      gsap.set(loader, { display: 'none' });
      setStatus(s, 'hotovo');
    } });
    tl.set(loader, { backgroundColor: 'rgba(0,0,0,0)' })
      .to(loader.querySelector('.meta'), { opacity: 0, duration: .2 }, 0)
      .to(mark, { x: r2.left - r1.left, y: r2.top - r1.top, scale: r2.width / r1.width,
        duration: .8, ease: 'expo.inOut' }, 0)
      .to(e.lines, { yPercent: 0, duration: .9, ease: 'expo.out', stagger: .07 }, .36)
      .to(e.phs, { clipPath: 'inset(0% 0% 0% 0%)', duration: .9, ease: 'expo.out', stagger: .06 }, .46)
      .to(e.fades, { opacity: 1, duration: .5, stagger: .05 }, .45);
  }

  /* ---------- run ---------- */
  let S = null, lastMode = 'normal';
  function setStatus(s, txt) { if (s === S) $('status').textContent = txt; }
  function start(mode) {
    if (S) S.dead = true;
    lastMode = mode;
    $('bFast').setAttribute('aria-pressed', mode === 'fast');
    $('bSlow').setAttribute('aria-pressed', mode === 'slow');
    resetPage(); layout();
    const s = S = { mode, t0: performance.now(), readyAt: 0, phase: 'idle', exitAt: 0, dead: false,
      reduced: $('bReduce').checked };
    setStatus(s, 'načítám…');
    // real page: Promise.all([document.fonts.ready, heroImg.decode(), window load])
    Promise.all([new Promise(r => setTimeout(r, LOAD_MS[mode])), document.fonts.ready]).then(() => {
      if (s.dead) return;
      s.readyAt = performance.now();
      setStatus(s, 'načteno ' + ((s.readyAt - s.t0) / 1000).toFixed(1).replace('.', ',') + ' s');
    });
    if (s.reduced) return runReduced(s);
    requestAnimationFrame(now => frame(s, now));
  }

  function frame(s, now) {
    if (s.dead) return;
    const t = (now - s.t0) / 1000;
    if (s.phase === 'idle' && s.readyAt && t >= MIN_SHOW) { s.phase = 'exit'; s.exitAt = t; }
    const E = s.phase === 'exit' ? t - s.exitAt : -1;

    // progress counter: honest asymptote while waiting, snaps to 100 when ready
    const est = s.readyAt ? 100 : 92 * (1 - Math.exp(-t / 1.6));
    pctEl.textContent = String(Math.round(est)).padStart(3, '0');

    shade(t, E);
    for (const p of tiles) {
      // birth: the field grows out of the corner
      const tb = 0.04 + 0.36 * (p.ring / maxRing) + 0.1 * p.b;
      let sc = easeOut((t - tb) / 0.16);
      if (E >= 0) {
        if (p.logo) {
          if (E < 0.001) p.lc = p.lvl;
          const m = smooth((E - 0.22) / 0.46);
          p.lvl = Math.round(p.lc + (p.g - p.lc) * m);
          sc = Math.max(sc, smooth(E / 0.3));        // logo tiles are always complete at the end
        } else {
          // dithered dissolve converging from the screen edge onto the logo
          const td = 0.5 * (1 - p.ring / maxRing) + 0.13 * p.b;
          sc = Math.min(sc, 1 - clamp01((E - td) / 0.15));
        }
      }
      p.s = sc;
    }
    draw();

    if (E >= EXIT) {
      // swap the canvas for the real SVG (pixel-identical) and hand off
      mark.style.visibility = 'visible';
      cv.style.display = 'none';
      s.phase = 'handoff';
      handoff(s);
      return;
    }
    requestAnimationFrame(n => frame(s, n));
  }

  function runReduced(s) {
    cv.style.display = 'none';
    gsap.fromTo(mark, { opacity: 0, visibility: 'visible' }, { opacity: 1, duration: .3 });
    const e = pageEls();
    const tick = () => {
      if (s.dead) return;
      const t = (performance.now() - s.t0) / 1000;
      pctEl.textContent = String(Math.round(s.readyAt ? 100 : 92 * (1 - Math.exp(-t / 1.6)))).padStart(3, '0');
      if (!(s.readyAt && t >= 0.4)) return void requestAnimationFrame(tick);
      gsap.set(e.lines, { yPercent: 0 });
      gsap.set(e.phs, { clipPath: 'inset(0% 0% 0% 0%)' });
      gsap.set(e.fades, { opacity: 1 });
      e.navMark.style.visibility = 'visible';
      loader.style.pointerEvents = 'none';
      gsap.to(loader, { opacity: 0, duration: .35, onComplete: () => {
        gsap.set(loader, { display: 'none' }); setStatus(s, 'hotovo');
      } });
    };
    tick();
  }

  $('bReplay').onclick = () => start(lastMode);
  $('bFast').onclick = () => start('fast');
  $('bSlow').onclick = () => start('slow');
  $('bReduce').onchange = () => start(lastMode);
  mq.addEventListener?.('change', () => { $('bReduce').checked = mq.matches; start(lastMode); });

  let rz;
  addEventListener('resize', () => {
    clearTimeout(rz);
    rz = setTimeout(() => { if (S && S.phase !== 'handoff') layout(); }, 120);
  });

  start('normal');
})();
</script>
</body>
</html>
